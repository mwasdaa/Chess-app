name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ChessHelper.zip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: cd ChessHelper && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ChessHelper-apk
          path: ChessHelper/app/build/outputs/apk/debug/app-debug.apk
